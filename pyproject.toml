[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "embeddinggemma-api"
version = "0.1.0"
description = "Multimodal embedding API for Google EmbeddingGemma 2 on CPU or Intel XPU"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pillow>=11,<12",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sentence-transformers==6.1.0",
  "torch==2.14.0",
  "torchvision==0.29.1",
  "triton-xpu>=3.8.0,<3.9",
  "transformers==5.19.0",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "asgi-lifespan>=2,<3",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-xpu" }
torchvision = { index = "pytorch-xpu" }
triton-xpu = { index = "pytorch-xpu" }

[tool.setuptools.packages.find]
include = ["embeddinggemma_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
