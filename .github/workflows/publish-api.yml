name: Publish EmbeddingGemma API image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-api.yml
      - Dockerfile.runtime-overlay
      - embeddinggemma_api/llama_proxy.py

concurrency:
  group: embeddinggemma-api-publish
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime-overlay
          push: true
          tags: ghcr.io/${{ github.repository }}:api-${{ github.sha }}
          cache-from: type=gha,scope=embeddinggemma-api
          cache-to: type=gha,mode=max,scope=embeddinggemma-api

      - name: Report image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "$DIGEST"
